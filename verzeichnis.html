*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8F4EA;--ink:#211D17;--muted:#6B6455;--line:#E4DBC5;--accent:#896C32;--soft:#F3EBD9;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1813;--ink:#F1ECE2;--muted:#B5AC9A;--line:#3A342A;--accent:#D2B270;--soft:#28231B;--card:#221E18}}
:root[data-theme="dark"]{--bg:#1B1813;--ink:#F1ECE2;--muted:#B5AC9A;--line:#3A342A;--accent:#D2B270;--soft:#28231B;--card:#221E18}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px 16px 48px}
.wrap{max-width:720px;margin:0 auto}
.zurueck{display:inline-block;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:12px}
.zurueck:hover{color:var(--accent)}
.tag{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
h1{font-size:24px;font-weight:600;line-height:1.2;margin:2px 0 6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.suche{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.suche input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.suche input:focus{outline:none;border-color:var(--accent)}
.buchstaben{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.buchstaben a{min-width:28px;text-align:center;padding:4px 0;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
.buchstaben a:hover{border-color:var(--accent);color:var(--accent)}
.filter{display:flex;gap:6px;margin-top:8px}
.filter button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:18px;font-weight:700;color:var(--accent);margin:18px 0 6px;scroll-margin-top:150px}
ul{list-style:none}
li a.e{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);margin-bottom:6px}
li a.e:hover{border-color:var(--accent)}
.n{font-weight:600;font-size:15px}
.w{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.w b{font-weight:500;color:var(--ink)}
.m{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;vertical-align:2px}
.leer{color:var(--muted);font-size:14px;padding:20px 0}
mark{background:var(--soft);color:inherit;border-radius:3px;padding:0 1px}
</style>
</head>

// Feedback-Eintrag öffnet den Knopf im Fuß, nicht die Rechtsseite
EINTRAEGE[EINTRAEGE.length - 1][2] = '#feedback';

(function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss'); }
  function buchstabe(n) { var b = norm(n).replace(/^[^a-z0-9]+/, '').charAt(0).toUpperCase(); return /[A-Z]/.test(b) ? b : '#'; }
  var LISTE = EINTRAEGE.map(function (e) {
    return { n: e[0], w: e[1], l: e[2], r: e[3], s: norm(e[0] + ' ' + e[1].join(' ') + ' ' + (e[4] || '')) };
  }).sort(function (a, b) { return a.n.localeCompare(b.n, 'de', { sensitivity: 'base' }); });
  var filter = 'alle', q = '';
  try { filter = localStorage.getItem('az-filter') || 'alle'; } catch (e) {}

  function markiere(t) {
    if (!q) return esc(t);
    var n = norm(t), i = n.indexOf(q);
    return i < 0 || n.length !== t.length ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
  }
  function zeichnen() {
    var worte = q.split(/\s+/).filter(Boolean);
    var treffer = LISTE.filter(function (e) {
      if (filter === 'l' && e.r === 'm') return false;
      if (filter === 'm' && e.r !== 'm') return false;
      return worte.every(function (w) { return e.s.indexOf(w) >= 0; });
    });
    var gruppen = {}, reihe = [];
    treffer.forEach(function (e) { var b = buchstabe(e.n); if (!gruppen[b]) { gruppen[b] = []; reihe.push(b); } gruppen[b].push(e); });
    document.getElementById('abc').innerHTML = reihe.map(function (b) { return '<a href="#b-' + b + '">' + b + '</a>'; }).join('');
    document.getElementById('liste').innerHTML = treffer.length ? reihe.map(function (b) {
      return '<h2 id="b-' + b + '">' + b + '</h2><ul>' + gruppen[b].map(function (e) {
        return '<li><a class="e" href="' + esc(e.l) + '"' + (e.l === '#feedback' ? ' data-fb="1"' : '') + '><span class="n">' + markiere(e.n) + '</span>' +
          (e.r === 'm' ? '<span class="m">Meisterin</span>' : '') +
          '<span class="w">' + e.w.map(function (x, i) { return i === e.w.length - 1 ? '<b>' + esc(x) + '</b>' : esc(x); }).join(' › ') + '</span></a></li>';
      }).join('') + '</ul>';
    }).join('') : '<p class="leer">Nichts gefunden. Probier ein anderes Wort, z. B. „Farbe“ oder „Rasur“.</p>';
    document.querySelectorAll('.filter button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.f === filter); });
  }
  document.getElementById('q').addEventListener('input', function () { q = norm(this.value.trim()); zeichnen(); });
  document.querySelectorAll('.filter button').forEach(function (b) {
    b.addEventListener('click', function () { filter = b.dataset.f; try { localStorage.setItem('az-filter', filter); } catch (e) {} zeichnen(); });
  });
  // „Feedback geben“: denselben Knopf wie im Fuß benutzen
  document.getElementById('liste').addEventListener('click', function (ev) {
    var a = ev.target.closest('a[data-fb]'); if (!a) return;
    ev.preventDefault(); var fb = document.getElementById('fb-link'); if (fb) fb.click();
  });
  zeichnen();
})();
</script>
